<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f2f5;
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        color: #2d3748;
        margin-bottom: 30px;
        font-size: 2rem;
      }

      /* Auth Form */
      .auth-box {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      .auth-box h2 {
        text-align: center;
        color: #2d3748;
        margin-bottom: 20px;
      }
      .auth-box input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1rem;
        margin-bottom: 12px;
        outline: none;
      }
      .auth-box input:focus {
        border-color: #667eea;
      }
      .auth-box button {
        width: 100%;
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .auth-box button:hover {
        background: #5a67d8;
      }
      .auth-box .switch {
        text-align: center;
        color: #667eea;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .auth-box .switch:hover {
        text-decoration: underline;
      }
      .error {
        color: red;
        text-align: center;
        margin-bottom: 10px;
        font-size: 0.9rem;
      }

      /* Task App */
      .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }
      .app-header h1 {
        margin-bottom: 0;
      }
      .logout-btn {
        padding: 8px 16px;
        background: #fc8181;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .logout-btn:hover {
        background: #f56565;
      }
      .welcome {
        text-align: center;
        color: #667eea;
        margin-bottom: 200px;
        font-weight: 600;
      }
      .add-task {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
      }
      .add-task input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        outline: none;
      }
      .add-task input:focus {
        border-color: #667eea;
      }
      .add-task button {
        padding: 12px 24px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
      }
      .add-task button:hover {
        background: #5a67d8;
      }
      .task-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .task-item {
        background: white;
        padding: 16px 20px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .task-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #667eea;
      }
      .task-title {
        flex: 1;
        font-size: 1rem;
        color: #2d3748;
      }
      .delete-btn {
        padding: 6px 14px;
        background: #fc8181;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .delete-btn:hover {
        background: #f56565;
      }
      .empty {
        text-align: center;
        color: #a0aec0;
        margin-top: 40px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Auth Section -->
      <div id="authSection">
        <h1>📝 Task Manager</h1>
        <div class="auth-box">
          <h2 id="authTitle">Login</h2>
          <p class="error" id="authError"></p>
          <input
            type="text"
            id="usernameInput"
            placeholder="Username"
            class="hidden"
          />
          <input type="email" id="emailInput" placeholder="Email" />
          <input type="password" id="passwordInput" placeholder="Password" />
          <button onclick="submitAuth()">Submit</button>
          <p class="switch" onclick="toggleAuth()">
            Don't have an account? Register
          </p>
        </div>
      </div>

      <!-- App Section -->
      <div id="appSection" class="hidden">
        <div class="app-header">
          <h1>📝 Task Manager</h1>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
         <p class="welcome" id="welcomeMsg"></p>
          <div class="add-task">
            <input
              type="text"
              id="taskInput"
              placeholder="Add a new task...."
            />
            <button onclick="addTask()">Add</button>
          </div>
          <div class="task-list" id="taskList"></div>
      </div>
    </div>

    <script>
      const API = "/tasks";
      const AUTH = "/auth";
      let isLogin = true;
      let token = localStorage.getItem("token");
      let currentUser = JSON.parse(localStorage.getItem("user") || "null");

      // Check if already logged in
      if (token) showApp();

      function toggleAuth() {
        isLogin = !isLogin;
        document.getElementById("authTitle").textContent = isLogin
          ? "Login"
          : "Register";
        document
          .getElementById("usernameInput")
          .classList.toggle("hidden", isLogin);
        document.querySelector(".switch").textContent = isLogin
          ? "Don't have an account? Register"
          : "Already have an account? Login";
        document.getElementById("authError").textContent = "";
      }

      async function submitAuth() {
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value.trim();
        const username = document.getElementById("usernameInput").value.trim();

        if (!email || !password || (!isLogin && !username)) {
          document.getElementById("authError").textContent =
            "Please fill in all fields!";
          return;
        }

        const endpoint = isLogin ? `${AUTH}/login` : `${AUTH}/register`;
        const body = isLogin
          ? { email, password }
          : { username, email, password };

        try {
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          const data = await res.json();

          if (!res.ok) {
            document.getElementById("authError").textContent = data.message;
            return;
          }

          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));
          token = data.token;
          currentUser = data.user;
          showApp();
        } catch (err) {
          document.getElementById("authError").textContent =
            "Something went wrong!";
        }
      }

      function showApp() {
        document.getElementById("authSection").classList.add("hidden");
        document.getElementById("appSection").classList.remove("hidden");
        document.getElementById("welcomeMsg").textContent =
          `Welcome back, ${currentUser?.username || "User"}! 👋`;
        loadTasks();
      }

      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        token = null;
        currentUser = null;
        document.getElementById("authSection").classList.remove("hidden");
        document.getElementById("appSection").classList.add("hidden");
        document.getElementById("emailInput").value = "";
        document.getElementById("passwordInput").value = "";
      }

      async function loadTasks() {
        try {
          const res = await fetch(API, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const tasks = await res.json();
          const list = document.getElementById("taskList");

          if (tasks.length === 0) {
            list.innerHTML =
              '<p class="empty">No tasks yet. Add one above!</p>';
            return;
          }

          list.innerHTML = tasks
            .map(
              (task) => `
                <div class="task-item">
                    <input type="checkbox"
                    ${task.completed ? "checked" : ""}
                    onchange="toggleTask('${task._id}', this.checked)"
                    />
                    <span class="task-title ${task.completed ? "completed" : ""}">
                        ${task.title}
                        </span>
                        <button class="delete-btn" onclick="deleteTask('${task._id}')">Delete</button>
                        </div>
                        `,
            )
            .join("");
        } catch (err) {
          console.error("Error loading tasks:", err);
        }
      }

      async function addTask() {
        const input = document.getElementById("taskInput");
        const title = input.value.trim();
        if (!title) {
          alert("Please enter a task!");
          return;
        }

        await fetch(API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ title }),
        });

        input.value = "";
        loadTasks();
      }

      async function toggleTask(id, completed) {
        await fetch(`${API}/${id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ completed }),
        });
        loadTasks();
      }

      async function deleteTask(id) {
        await fetch(`${API}/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        loadTasks();
      }

      document.addEventListener("DOMContentLoaded", () => {
        document
          .getElementById("taskInput")
          ?.addEventListener("keypress", (e) => {
            if (e.key === "Enter") addTask();
          });
        document
          .getElementById("passwordInput")
          ?.addEventListener("keypress", (e) => {
            if (e.key === "Enter") submitAuth();
          });
      });
    </script>
  </body>
</html>
