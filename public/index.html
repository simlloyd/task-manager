<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #2d3748; margin-bottom: 30px; font-size: 2rem; }

    /* Auth Form */
    .auth-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .auth-box h2 { text-align: center; color: #2d3748; margin-bottom: 20px; }
    .auth-box input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
    }
    .auth-box input:focus { border-color: #667eea; }
    .auth-box button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .auth-box button:hover { background: #5a67d8; }
    .auth-box .switch {
      text-align: center;
      color: #667eea;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .auth-box .switch:hover { text-decoration: underline; }
    .error { color: red; text-align: center; margin-bottom: 10px; font-size: 0.9rem; }

    /* Task App */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .app-header h1 { margin-bottom: 0; }
    .logout-btn {
      padding: 8px 16px;
      background: #fc8181;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .logout-btn:hover { background: #f56565; }
    .welcome { text-align: center; color: #667eea; margin-bottom: 20px; font-weight: 600; }
    .add-task { display: flex; gap: 10px; margin-bottom: 30px; }
    .add-task input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    .add-task input:focus { border-color: #667eea; }
    .add-task button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    .add-task button:hover { background: #5a67d8; }
    .task-list { display: flex; flex-direction: column; gap: 12px; }
    .task-item {
      background: white;
      padding: 16px 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .task-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #667eea; }
    .task-title { flex: 1; font-size: 1rem; color: #2d3748; }
    .task-title.completed { text-decoration: line-through; color: #a0aec0; }
    .delete-btn {
      padding: 6px 14px;
      background: #fc8181;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .delete-btn:hover { background: #f56565; }
    .empty { text-align: center; color: #a0aec0; margin-top: 40px; }
    .hidden { display: none; }
  </style>
</head>
<body>

    <!-- Auth Section -->
    <div class="auth-container" id="authContainer">
      <div class="auth-box">
         <h1>📝 Task Manager</h1>
         <p class="subtitle" id="authSubtitle">Sign in to your account</p>
         <div class="alert alert-error" id="authAlert"></div>
         <input type="text" id="nameField" placeholder="Full Name" style="display: none" />
         <input type="email" id="emailField" placeholder="Email" />
         <input type="password" id="passwordField" placeholder="Password" />
         <button class="btn-primary" onclick="submitAuth()"> Sign In</button>
         <div class="auth-switch">
          <span id="authSwitchText">Don't have an account? <span onclick="toggleAuth()">Register</span></span>
         </div> 
      </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">
      <div class="navbar">
        <div class="logo">📝 Task Manager</div>
        <div class="user-info">
          <span id="welcomeText"></span>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </div>

      <div class="main">
        <!-- Add Task -->
         <div class="add-task-card">
            <h2>✨ Add New Task</h2>
            <input type="text" id="taskTitle" placeholder="What needs to be done?" />
            <div class="task-options">
              <select name="" id="taskPriority">
                  <option value="medium">🟡 Medium Priority</option>
                  <option value="high">🔴 High Priority</option>
                  <option value="low">🟢 Low Priority</option>
              </select>
                <input type="date" id="taskDueDate" />
            </div>
            <button class="btn-add" onclick="addTask()">+ Add Task</button>
         </div>

         <!-- Filters -->
          <div class="Filters">
            <button class="filter-btn active" onclick="filterTasks('all', this)">All</button>
            <button class="filter-btn" onclick="filterTasks('high', this)">🔴 High</button>
            <button class="filter-btn" onclick="filterTasks('medium', this)">🟡 Medium</button>
            <button class="filter-btn" onclick="filterTasks('low', this)">🟢 Low</button>
            <button class="filter-btn" onclick="filterTasks('completed', this)">✅ Completed</button>
          </div>

          <!-- Task List -->
           <div class="task-list" id="taskList"></div>
      </div>
    </div>

  

  <script>
    const API = '';
    let token = localStorage.getItem('token');
    let username = localStorage.getItem('username');
    let allTasks = [];
    let isLogin = true;

    // Check if already logged in
    if (token) showDashboard();

    function toggleAuth() {
      isLogin = !isLogin;
      document.getElementById('nameField').style.display = isLogin ? 'none' : 'block';
      document.getElementById('authSubtitle').textContent = isLogin ? 'Sign in to your account' : 'Create a new account';
      document.getElementById('authSwitchText').innerHTML = isLogin
      ? 'Don\'t have an account? <span onclick="toggleAuth()">Register</span>'
      : 'Already have an account? <span onclick="toggleAuth()">Sign In</span>';
      document.querySelector('.btn-primary').textContent = isLogin ? 'Sign In' : 'Register';
    }

    async function submitAuth() {
      const email = document.getElementById('emailField').value.trim();
      const password = document.getElementById('passwordField').value.trim();
      const name = document.getElementById('nameField').value.trim();
      const alert = document.getElementById('authAlert');

      if (!email || !password) return showAlert(alert, 'Please fill in all fields.');
      if (!isLogin && !name) return showAlert(alert, 'Please enter your name. ');

      const url = isLogin ? '/api/auth/login' : '/api/auth/register';
      const body = isLogin ? { email, password } : { name, email, password };

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (!res.ok) return showAlert(alert, data.message || 'Something went wrong. ');
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.user?.name || email.split('@')[0]);
        token = data.token;
        username = localStorage.getItem('username');
        showDashboard();

      } catch (err) {
        showAlert(alert, 'Server error. Please try again. ');
      }
    }

    function showDashboard() {
      document.getElementById('authContainer').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('welcomeText').textContent = `Welcome back, ${username}! 👋`;
      loadTasks();
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      location.reload();
    }

    async function loadTasks() {
      try {
        const res = await fetch('/api/tasks', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        allTasks = await res.json();
        renderTasks(allTasks);

      } catch (err) {
        console.error(err);
      }
    }

    async function addTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const priority = document.getElementById('taskPriority').value;
      const dueDate = document.getElementById('taskDueDate').value;
      if (!title) return; 

      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ title, priority, dueDate: dueDate || null })
        });
        const task = await res.json();
        allTasks.unshift(task);
        renderTasks(allTasks);
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDueDate').value = '';
        document.getElementById('taskPriority').value = 'medium';
      } catch (err) {
        console.log(err);
      }
    }

    async function toggleComplete(id, completed) {
      try {
        const res = await fetch(`/api/tasks/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ completed: !completed })
        });
        const updated = await res.json();
        allTasks = allTasks.map(t => t._id === id ? updated : t);
        renderTasks(allTasks);
      } catch (err) {
        console.error(err);
      }
    }

    async function deleteTask(id) {
      try {
        await fetch(`/api/tasks/${id}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` }
        });
        allTasks = allTasks.filter(t => t._id !== id);
        renderTasks(allTasks);
      } catch (err) {
        console.error(err);
      }
      
    }

    function filterTasks(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (type === 'all') return renderTasks(allTasks);
      if (type === 'completed') return renderTasks(allTasks.filter(t => t.completed));
      renderTasks(allTasks.filter(t => t.priority === type && !t.completed));
    }

    function renderTasks(tasks) {
      const list = document.getElementById('taskList');
      if (!tasks.length) {
        list.innerHTML = `<div class="empty-state"><div class="icon">🎉</div><p>No Tasks here!</p></div>`;
        return;
      }
      list.innerHTML = tasks.map(task => {
        const due = task.dueDate ? new Date(task.dueDate) : null;
        const isOverdue = due && due < new Date() && !task.completed;
        const dueDateStr = due ? `<span class="due-date ${isOverdue ? 'overdue' : ''}">📅 ${due.toLocaleDateString()}</span>` : '';
        return `
        <div class="task-card priority-${task.priority} ${task.completed ? 'completed' : ''}">
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleComplete('${task._id}', ${task.completed})"/>
          <div class="task-info">
            <div class="task-title">${task.title}</div>
            <div class="task-meta">
              <span class="badge badge-${task.priority}">${task.priority}</span>
              ${dueDateStr}
              </div>
              </div>
              <button class="btn-delete" onclick="deleteTask('${task._id}')">Delete</button>
              </div>`;
      }).join('');
    }

    function showAlert(el, msg) {
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }

    document.addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        if (document.getElementById('dashboard').style.display === 'block') addTask();
        else submitAuth();
      }
    });
  </script>
</body>
</html>
